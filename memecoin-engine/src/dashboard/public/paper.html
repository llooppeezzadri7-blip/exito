<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper trading — Memecoin Intelligence Engine</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<header><h1>MEMECOIN INTELLIGENCE ENGINE</h1><span class="live" id="live"><span class="dot"></span><span class="t">…</span></span><nav><a href="/">Live market</a><a href="/health.html">Health</a><a class="active" href="/paper.html">Paper trading</a></nav></header>
<main id="main"><div class="muted">loading…</div></main>
<script src="/app.js"></script>
<script>
const { API, esc, num, age, usd, setLive, post, catBadge } = window.D;
async function load() {
  const [p, l, h] = await Promise.all([API("/api/paper"), API("/api/learning"), API("/api/health")]); setLive(h);
  const s = p.stats;
  document.getElementById("main").innerHTML = `
  ${s.sampleWarning ? `<div class="card" style="border-color:var(--amber)"><b>⚠ ${esc(s.sampleWarning)}</b></div>` : ""}
  <div class="grid stats" style="margin-top:12px">${[["CLOSED TRADES", s.trades], ["OPEN", s.open], ["WIN RATE", s.winRate == null ? "—" : Math.round(s.winRate * 100) + "%"], ["AVG RETURN", s.averageReturnPct == null ? "—" : s.averageReturnPct + "%"], ["MEDIAN RETURN", s.medianReturnPct == null ? "—" : s.medianReturnPct + "%"], ["AVG WIN", s.averageWinPct == null ? "—" : s.averageWinPct + "%"], ["AVG LOSS", s.averageLossPct == null ? "—" : s.averageLossPct + "%"], ["EXPECTED VALUE", s.expectedValuePct == null ? "—" : s.expectedValuePct + "%"], ["MAX DRAWDOWN", s.maxDrawdownPct == null ? "—" : s.maxDrawdownPct + "%"], ["FALSE POSITIVE RATE", s.falsePositiveRate == null ? "—" : Math.round(s.falsePositiveRate * 100) + "%"], ["TOTAL PNL", usd(s.totalPnlUsd)]].map(([k, v]) => `<div class="card stat"><div class="v">${esc(v)}</div><div class="l">${k}</div></div>`).join("")}</div>
  <div class="card" style="margin-top:12px"><h2>Simulated trades (slippage + fees applied; exits on risk events use double slippage)</h2><table><tr><th>Token</th><th>Opened</th><th>Entry fill</th><th>Size</th><th>Exit</th><th>PnL</th><th>Max DD</th><th>Reason</th><th>Exit reason</th><th></th></tr>${p.trades.map((t) => `<tr><td><a href="/token.html?mint=${t.mint}">$${esc(t.symbol || t.mint.slice(0, 6))}</a> ${catBadge(t.opportunityCategory)}</td><td>${age(t.openedAt)} ago</td><td>${t.entryFillPriceUsd.toPrecision(4)}</td><td>${usd(t.sizeUsd)}</td><td>${t.exitFillPriceUsd ? t.exitFillPriceUsd.toPrecision(4) : "—"}</td><td class="${(t.pnlPct ?? 0) >= 0 ? "pos" : "neg"}">${t.pnlPct == null ? "open" : t.pnlPct + "%"}</td><td>${t.maxDrawdownPct}%</td><td class="small muted">${esc(t.reason)}</td><td class="small">${esc(t.exitReason || "")}</td><td>${t.status === "OPEN" ? `<button class="btn" onclick="post('/api/paper/${t.id}/close').then(load)">close</button>` : ""}</td></tr>`).join("") || "<tr><td colspan=10 class='muted'>no paper trades yet — they open automatically on HIGH_CONVICTION_SETUP (EARLY) or manually from a token page</td></tr>"}</table></div>
  <div class="card" style="margin-top:12px"><h2>Learning engine (rule → statistical)</h2><div class="small">${esc(l.report.notes.join(" · "))}</div>
    <table style="margin-top:8px"><tr><th>Category</th><th>n</th><th>good rate</th><th>bad rate</th><th>median return</th></tr>${Object.entries(l.report.byCategory).map(([k, v]) => `<tr><td>${catBadge(k)}</td><td>${v.n}</td><td>${Math.round(v.goodRate * 100)}%</td><td>${Math.round(v.badRate * 100)}%</td><td>${v.medianReturn == null ? "—" : v.medianReturn + "%"}</td></tr>`).join("") || "<tr><td colspan=5 class='muted'>no resolved predictions yet</td></tr>"}</table>
    ${l.report.featureLifts.length ? `<h2 style="margin-top:10px">Feature lifts (P(good | high) − P(good | low), median split)</h2><table><tr><th>Feature</th><th>n</th><th>threshold</th><th>lift</th><th>bad rate high</th></tr>${l.report.featureLifts.slice(0, 20).map((f) => `<tr><td>${esc(f.feature)}</td><td>${f.samples}</td><td>${f.threshold}</td><td class="${f.lift >= 0 ? "pos" : "neg"}">${f.lift}</td><td>${Math.round(f.badRateHigh * 100)}%</td></tr>`).join("")}</table>` : ""}
    <h2 style="margin-top:10px">Model versions</h2>${l.models.length ? l.models.map((m) => `<div class="small">${esc(m.version)} · ${esc(m.kind)} · ${m.active ? '<span class="badge b-green">active</span>' : `<button class="btn" onclick="fetch('/api/learning/activate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({version:'${esc(m.version)}'})}).then(load)">activate</button>`} · <span class="mono">${esc(JSON.stringify(m.weights))}</span></div>`).join("") : '<span class="muted small">none (proposed automatically after enough resolved samples; activation is manual, positives only)</span>'}</div>
  <p class="disclaimer">Paper trading is a simulation on stored prices with slippage/fee assumptions; real fills on illiquid tokens are worse. No real trading exists in this system.</p>`;
}
load(); setInterval(load, 30000);
</script>
</body></html>
