# MEMECOIN INTELLIGENCE ENGINE — 24/7 deployment (VPS). Read-only + paper trading; no wallet, no keys.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: memecoin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memecoin}
      POSTGRES_DB: memecoin
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memecoin -d memecoin"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

  engine:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://memecoin:${POSTGRES_PASSWORD:-memecoin}@db:5432/memecoin
      API_HOST: 0.0.0.0
      API_PORT: "8080"
      CONFIG_PATH: /app/config.yaml
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    logging: { driver: json-file, options: { max-size: "50m", max-file: "10" } }
    deploy:
      resources:
        limits: { memory: 1g }

volumes:
  pgdata:
